plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.example.speed_app"

    // ⭐ Force ONE SDK version so GitHub Actions stops installing 30, 31, 33
    compileSdk = 34

    // ⭐ Required for Flutter 3.22
    ndkVersion = flutter.ndkVersion

    // ⭐ Modern Java/Kotlin support (fastest + most compatible)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.speed_app"

        // ⭐ Minimum supported by Flutter + your plugins
        minSdkVersion 23

        // ⭐ Force one target SDK (prevents GitHub from installing 3 extra platforms)
        targetSdkVersion 34

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // ⭐ Debug signing for easy GitHub builds
            signingConfig = signingConfigs.debug

            // ⭐ Keep these off unless you want Play Store shrinking
            minifyEnabled false
            shrinkResources false

            // ⭐ MASSIVE SPEED BOOST: disable native debug symbols
            ndk {
                debugSymbolLevel 'none'
            }
        }
    }
}

flutter {
    source = "../.."
}

